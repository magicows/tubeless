name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]      # Raspberry Pi OS Bullseye ships 3.9, Trixie 3.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee pytest-output.txt || status=$?
          # show each failure as an annotation on the run, so it can be read without opening the log
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | cut -c1-300 | while read -r line; do echo "::error::$line"; done
          exit ${status:-0}
